name: Android checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate resources
        run: |
          python3 scripts/localization.py
          python3 scripts/validate_store_metadata.py
          python3 -m unittest billing.test_handler
          node --test billing/cloudflare/worker.test.mjs
      - name: Build Android artifacts and run unit tests
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease :app:lintRelease

